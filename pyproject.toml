[project]
name = "agent-crewai-starter"
version = "1.0.0"
description = "A real CrewAI multi-agent starter wrapped as an MCP server"
requires-python = ">=3.10"
dependencies = [
    "crewai>=0.30.0",
    "langchain>=0.1.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
crewai-starter = "main:run"
